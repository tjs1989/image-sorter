logging_formats:
  string_format: "%(asctime)s: %(levelname)s: %(message)s"
  "date_format": "%d-%m-%Y %H:%M:%S"
date_time_formats:
    "dmy_slashes": "%d/%m/%Y"
    "dmy_dashes": "%d-%m-%y"
    "dmy": "%d%m%y"
    "year": "%Y"
    "full_month_name": "%B"
log_file_name: "debug.log"
initial_folder_structure:
   - "Images"
   - "Videos"
   - "Audio"
image_file_extensions:
  - ".jpg"
  - ".png"
  - ".gif"
  - ".jpeg"
  - ".heic"
  - ".heif"
# What sort recognises and files into Videos/. Deliberately broader than anything
# delete or discard targets: recognising a container costs nothing, failing to
# recognise one leaves files behind in the source folder.
video_file_extensions:
  - ".mp4"
  - ".mov"
  - ".avi"
  - ".m4v"
  - ".mpeg"
  - ".mpg"
  - ".3gp"
  - ".3g2"
  - ".webm"
  - ".mkv"
audio_file_extensions:
  - ".mp3"
  - ".wav"
  - ".m4a"
# Deleted outright by "sort -p <phone type>", at any size, before sorting starts.
# Only for extensions that are junk *because of the phone they came from*, which is
# why ".mp4" is here rather than in delete_below_size: the iPhone camera only records
# ".mov", so an iPhone ".mp4" arrived from elsewhere, but an Android ".mp4" is a camera
# original. It stays in video_file_extensions so every other phone still sorts it.
discard_file_extensions:
  iphone:
    - ".aae"
    - ".mp4"
# Deleted by the "delete" command, only when under size_in_bytes AND in this list.
# Stills only. Size does not identify junk video: a 480p messaging clip outweighs a
# short camera original, so messaging video is handled by discard_file_extensions.
delete_below_size:
  size_in_bytes: 1000000
  file_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
android_source_paths:
  - "/sdcard/DCIM"
  - "/sdcard/Pictures"
  - "/sdcard/Movies"
  - "/sdcard/Music"
android_purge_only_paths:
  - "/sdcard/Android/media/com.whatsapp/WhatsApp/Media"
google_drive:
  # Paths are relative to the repo root (or absolute). Both files are gitignored.
  client_secrets_path: "client_secrets.json"
  token_path: "drive_token.json"
  # Full drive scope is required to reuse folders you created in the Drive web UI.
  # Narrow to ".../auth/drive.file" only if you let the app own an isolated folder.
  scope: "https://www.googleapis.com/auth/drive"
