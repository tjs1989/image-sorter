logging_formats:
  string_format: "%(asctime)s: %(levelname)s: %(message)s"
  "date_format": "%d-%m-%Y %H:%M:%S"
date_time_formats:
    "dmy_slashes": "%d/%m/%Y"
    "dmy_dashes": "%d-%m-%y"
    "dmy": "%d%m%y"
    "year": "%Y"
    "full_month_name": "%B"
log_file_name: "debug.log"
initial_folder_structure:
   - "Images"
   - "Videos"
   - "Audio"
image_file_extensions:
  - ".jpg"
  - ".png"
  - ".gif"
  - ".jpeg"
  - ".heic"
  - ".heif"
video_file_extensions:
  - ".mp4"
  - ".mov"
  - ".avi"
audio_file_extensions:
  - ".mp3"
  - ".wav"
  - ".m4a"
discard_file_extensions:
  iphone:
    - ".aae"
one_megabyte_in_bytes: 1000000
android_source_paths:
  - "/sdcard/DCIM"
  - "/sdcard/Pictures"
  - "/sdcard/Movies"
  - "/sdcard/Music"
android_purge_only_paths:
  - "/sdcard/Android/media/com.whatsapp/WhatsApp/Media"
google_drive:
  # Paths are relative to the repo root (or absolute). Both files are gitignored.
  client_secrets_path: "client_secrets.json"
  token_path: "drive_token.json"
  # Full drive scope is required to reuse folders you created in the Drive web UI.
  # Narrow to ".../auth/drive.file" only if you let the app own an isolated folder.
  scope: "https://www.googleapis.com/auth/drive"
